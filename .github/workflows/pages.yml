name: Validate and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract validated research package
        run: python -m zipfile -e Vivienda_Peru_2026_Datos_Protocolo_Visor_v1_0_2.zip /tmp/vivienda-source
      - name: Validate data and local downloads
        run: python /tmp/vivienda-source/Vivienda_Peru_2026/scripts/validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/vivienda-source/Vivienda_Peru_2026/docs
      - uses: actions/deploy-pages@v4
        id: deployment
